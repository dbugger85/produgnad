  <ellipse cx="190" cy="280" rx="64" ry="110" fill="#f9fbfc" stroke="#d5dde6" stroke-width="2"/>
  <ellipse cx="190" cy="280" rx="46" ry="80" fill="none" stroke="#e6ebf0" stroke-width="2"/>
  <ellipse cx="190" cy="280" rx="22" ry="38" fill="#c9a77c"/>
  <ellipse cx="192" cy="281" rx="14" ry="27" fill="#8b6a45"/>
</svg>
