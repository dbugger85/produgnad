<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef3f8"/><stop offset="1" stop-color="#b9cbe0"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9e0e8"/><stop offset=".4" stop-color="#ffffff"/><stop offset="1" stop-color="#cdd6e0"/></linearGradient>
    <!-- One roll standing up: bottom curve first, then the side, then the top with the cardboard core -->
    <g id="roll">
      <ellipse cx="0" cy="140" rx="82" ry="22" fill="#cdd6e0"/>
      <rect x="-82" y="0" width="164" height="140" fill="url(#side)"/>
      <ellipse cx="0" cy="0" rx="82" ry="22" fill="#fbfcfd" stroke="#dbe2ea" stroke-width="2"/>
      <ellipse cx="0" cy="0" rx="24" ry="7" fill="#c9a77c"/>
      <ellipse cx="0" cy="1" rx="15" ry="4" fill="#8b6a45"/>
    </g>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="215" ry="20" fill="#000" opacity=".12"/>
  <use href="#roll" x="212" y="338"/>
  <use href="#roll" x="388" y="338"/>
  <use href="#roll" x="300" y="176"/>
</svg>
