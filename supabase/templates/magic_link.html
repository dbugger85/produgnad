<div style="max-width:520px;margin:0 auto;padding:24px 16px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#121a26">
  <p style="margin:0 0 16px"><img src="https://dugnad.substitutor.no/email-logo.png" width="180" height="48" alt="ProDugnad" style="display:block;border:0"></p>
  <div style="background:#ffffff;border:1px solid #dedad2;border-radius:16px;padding:20px">
    <h1 style="font-size:20px;margin:0 0 12px">Logg inn på dugnaden</h1>
    <p>Skriv inn denne koden på siden du har åpen:</p>
    <p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:12px 0;color:#002e5f">{{ .Token }}</p>
    <p>Eller trykk her for å logge inn:</p>
    <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#002e5f;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:12px">Logg inn</a></p>
    <p style="font-size:13px;color:#5d6472">Koden virker i én time. Har du ikke bedt om denne e-posten, kan du se bort fra den.</p>
  </div>
</div>
